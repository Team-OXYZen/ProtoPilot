
<div class="room-list-container">
  <h2>Our Rooms</h2>
  <div *ngIf="rooms$ | async as rooms; else loading" class="room-grid">
    <div *ngFor="let room of rooms; let i = index" class="room-card" [style.animation-delay.ms]="i * 100">
      <div class="card-image">
        <img [src]="room.imageUrl" [alt]="room.name">
      </div>
      <div class="card-content">
        <h3>{{ room.name }}</h3>
        <p class="description">{{ room.description }}</p>
        <div class="amenities">
          <span *ngFor="let amenity of room.amenities" class="amenity-tag">{{ amenity }}</span>
        </div>
        <div class="card-footer">
          <span class="price">${{ room.price }} / night</span>
          <button class="btn btn-accent">Book Now</button>
        </div>
      </div>
    </div>
  </div>

  <ng-template #loading>
    <div class="loading-spinner">
        <p>Loading rooms...</p>
    </div>
  </ng-template>
</div>
