<div class="sidebar">
  <div class="chat-section">
    <div #chatHistoryElement class="chat-history">
      @for(msg of chatHistory(); track msg.id){
        @if(msg.type === "activity"){
          <div class="activity-msg" [class]="'activity-' + (msg.status || 'info')">
            <span class="activity-dot"></span>
            <span>{{ msg.text }}</span>
          </div>
        } @else if(msg.type != "user"){
          <div class="system-msg">
            <markdown [data]="msg.text"></markdown>
          </div>
        }@else{
          <div class="user-msg">
            <div class="user-msg-content">{{msg.text}} </div>
          </div>
        }
      }
      @if(isThinking()) {
        <div class="ai-thinking">
          <p class="thinking-text">Thinking...</p>
          <div class="thinking-stars">
            <div class="star star-1"></div>
            <div class="star star-2"></div>
            <div class="star star-3"></div>
            <div class="star star-4"></div>
          </div>
        </div>
      }
    </div>
    <div class="bottom-section">
      <div class="input-wrapper">
        <textarea
          [(ngModel)]="chatMessage"
          placeholder="Describe the changes in natural language..."
          rows="3"
          [disabled]="isThinking()">
        </textarea>
        <button 
          class="send-btn"
          (click)="sendChatMessage()" 
          [disabled]="sendBtnDisabled() || isThinking()"
          [title]="sendBtnText()">
          <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
            <line x1="22" y1="2" x2="11" y2="13"></line>
            <polygon points="22 2 15 22 11 13 2 9 22 2"></polygon>
          </svg>
        </button>
      </div>
    </div>
  </div>
</div>
