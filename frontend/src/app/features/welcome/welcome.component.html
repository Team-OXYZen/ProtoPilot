<div class="welcome-container">
  <header class="welcome-header">
    <button class="logo-link" title="Home">
      <h1 class="logo">ProtoPilot</h1>
    </button>
    <div class="header-actions">
      <app-theme-toggle></app-theme-toggle>
      @if (!(authService.isAuthenticated()())) {
        <button class="btn-login" (click)="openLogin()" aria-label="Login">
          <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
            <path d="M15 3h4a2 2 0 0 1 2 2v14a2 2 0 0 1-2 2h-4"></path>
            <polyline points="10 17 15 12 10 7"></polyline>
            <line x1="15" y1="12" x2="3" y2="12"></line>
          </svg>
          <span>Login</span>
        </button>
        <button class="btn-signup" (click)="openSignUp()" aria-label="Sign Up">
          <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
            <path d="M16 21v-2a4 4 0 0 0-4-4H5a4 4 0 0 0-4 4v2"></path>
            <circle cx="8.5" cy="7" r="4"></circle>
            <line x1="20" y1="8" x2="20" y2="14"></line>
            <line x1="23" y1="11" x2="17" y2="11"></line>
          </svg>
          <span>Sign Up</span>
        </button>
      } @else {
        <button class="btn-dashboard" (click)="goToDashboard()" aria-label="Dashboard">
          <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
            <rect x="3" y="3" width="7" height="7"></rect>
            <rect x="14" y="3" width="7" height="7"></rect>
            <rect x="14" y="14" width="7" height="7"></rect>
            <rect x="3" y="14" width="7" height="7"></rect>
          </svg>
          <span>Dashboard</span>
        </button>
        <button class="btn-logout" (click)="logout()" aria-label="Logout">
          <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
            <path d="M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4"></path>
            <polyline points="16 17 21 12 16 7"></polyline>
            <line x1="21" y1="12" x2="9" y2="12"></line>
          </svg>
          <span>Logout</span>
        </button>
      }
    </div>
  </header>

  <div class="hero-section">
    <div class="hero-content">
      <div class="animated-background"></div>
      
      <div class="hero-text">
        <h2 class="hero-title">ProtoPilot</h2>
        <p class="hero-subtitle">Turning Product Vision into Working Prototypes</p>
        <p class="hero-description">
          From requirements to production-ready code in minutes. Transform your product ideas into tangible prototypes with AI-powered development.
        </p>
      </div>

      <div class="cta-buttons">
        <button class="btn-primary-large" (click)="openLogin()" aria-label="Get Started">
          <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
            <path d="M13 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V9z"></path>
            <polyline points="13 2 13 9 20 9"></polyline>
          </svg>
          <span>Get Started</span>
        </button>
        <button class="btn-secondary-large" (click)="openSignUp()" aria-label="Learn More">
          <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
            <circle cx="12" cy="12" r="10"></circle>
            <line x1="12" y1="16" x2="12" y2="12"></line>
            <line x1="12" y1="8" x2="12.01" y2="8"></line>
          </svg>
          <span>Learn More</span>
        </button>
      </div>
    </div>

    <div class="floating-elements">
      <div class="float float-1"></div>
      <div class="float float-2"></div>
      <div class="float float-3"></div>
      <div class="float float-4"></div>
      <div class="float float-5"></div>
    </div>
  </div>

  @if (showAuthModal()) {
    <app-auth-modal (closeModal)="closeModal()" />
  }
</div>
