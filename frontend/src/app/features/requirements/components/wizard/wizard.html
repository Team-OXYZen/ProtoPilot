<app-header>
  <h2 class="page-title" header-center>Requirements Wizard</h2>
</app-header>

<div class="wizard-container">

  @if (!projectCreated) {
    <div class="wizard-card">
      <h2 class="question-title">Create Project</h2>

      <div class="input-wrapper">
        <input
          [(ngModel)]="userId"
          placeholder="User ID"
          class="input-area"
        />
      </div>

      <div class="input-wrapper">
        <input
          [(ngModel)]="projectTitle"
          placeholder="Project Title"
          class="input-area"
        />
      </div>

      <div class="input-wrapper">
        <textarea
          [(ngModel)]="projectDescription"
          placeholder="Project Description"
          class="input-area">
        </textarea>
      </div>

      <button
        class="send-btn"
        (click)="createProject()"
        [disabled]="!userId || !projectTitle">
        Create Project
      </button>
    </div>
  } @else {

    <div class="wizard-card" [class.thinking]="isLoading()">

      <h2 class="question-title">
        {{currentQuestion.summary}}
      </h2>

      @if(isLoading()) {
        <p class="thinking-text">Thinking...</p>
      }

      <h3 class="question-subtitle">
        {{currentQuestion.question}}
      </h3>

      @if(!isLoading()) {
        <div class="suggestions">
          @for(s of currentQuestion.suggestions; track s){
            <button
              (click)="selectSuggestion(s)"
              class="chip"
              [class.selected]="s.selected">
              {{s.label}}
            </button>
          }
        </div>
      } @else {
        <div class="thinking-animation">
          <div class="thinking-stars">
            <div class="star star-1"></div>
            <div class="star star-2"></div>
            <div class="star star-3"></div>
            <div class="star star-4"></div>
            <div class="star star-5"></div>
          </div>
        </div>
      }

      <div class="input-wrapper">
        <textarea
          [(ngModel)]="answer"
          id="answer"
          placeholder="Type your answer..."
          class="input-area"
          [disabled]="isLoading()">
        </textarea>

        <button
          class="send-btn"
          (click)="handleSendMessage()"
          [disabled]="isLoading() || !answer"
          [title]="isLoading() ? 'Thinking...' : 'Send'">
          <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
            <line x1="22" y1="2" x2="11" y2="13"></line>
            <polygon points="22 2 15 22 11 13 2 9 22 2"></polygon>
          </svg>
        </button>
      </div>

    </div>
  }

</div>
